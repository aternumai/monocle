name: Bug report
description: Report a reproducible problem in Monocle
title: "bug: "
labels: ["kind:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include private file paths unless necessary.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.5"
  - type: input
    id: monocle
    attributes:
      label: Monocle version or commit
  - type: dropdown
    id: fda
    attributes:
      label: Full Disk Access enabled?
      options:
        - "No"
        - "Yes"
        - "Not sure"
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
